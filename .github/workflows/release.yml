name: Release alpha
on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version (for example 0.1.0-alpha.3)
        required: true
        default: 0.1.0-alpha.3
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
env:
  CADENCE_RELEASE_VERSION: ${{ inputs.version }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence-test
          POSTGRES_DB: cadence
        ports: [55432:5432]
        options: --health-cmd "pg_isready -U cadence" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate prerelease version
        run: '[[ "$CADENCE_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: pnpm install --frozen-lockfile
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm test:db
        env:
          CADENCE_TEST_DATABASE_URL: postgres://cadence:cadence-test@localhost:55432/cadence
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/release/*
          if-no-files-found: error
  container:
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: cadence:test
          cache-from: type=gha,scope=${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runner }}
      - run: pnpm test:container
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag cadence:test "ghcr.io/lojhan/cadence:$CADENCE_RELEASE_VERSION-$ARCH"
          docker push "ghcr.io/lojhan/cadence:$CADENCE_RELEASE_VERSION-$ARCH"
  publish:
    needs: [verify, container]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest and package assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker buildx imagetools create --tag "ghcr.io/lojhan/cadence:$CADENCE_RELEASE_VERSION" \
            "ghcr.io/lojhan/cadence:$CADENCE_RELEASE_VERSION-amd64" \
            "ghcr.io/lojhan/cadence:$CADENCE_RELEASE_VERSION-arm64"
          gh release create "v$CADENCE_RELEASE_VERSION" artifacts/release/* \
            --target "$GITHUB_SHA" --prerelease --title "Cadence $CADENCE_RELEASE_VERSION" \
            --notes-file docs/ALPHA_RELEASE.md
