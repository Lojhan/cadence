<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cadence — Tuner concept</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #171e1b;
        --surface: #202a23;
        --surface-hover: #304135;
        --foreground: #e2e9d8;
        --muted: #9eac9c;
        --border: #3b473c;
        --primary: #b0cfa1;
        --primary-foreground: #17231b;
        --string: #556358;
        --good: #b4dba0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --background: #f3f1e9;
        --surface: #e9ede2;
        --surface-hover: #dce6d2;
        --foreground: #273e35;
        --muted: #647468;
        --border: #cbd4c8;
        --primary: #30664b;
        --primary-foreground: #fcfbf6;
        --string: #a0b09e;
        --good: #30664b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body { background: var(--background); color: var(--foreground); }
      button, summary { -webkit-tap-highlight-color: transparent; }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, summary:focus-visible, label:focus-within { outline: 2px solid var(--primary); outline-offset: 4px; }
      svg { display: block; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .app {
        height: 100dvh;
        min-height: 0;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background: radial-gradient(ellipse 75% 60% at 50% 42%, #233027 0%, var(--background) 75%);
      }
      :root[data-theme="light"] .app { background: radial-gradient(ellipse 75% 60% at 50% 42%, #fcfbf6 0%, var(--background) 75%); }
      .topbar, .toolbar, .mode-switch, .status { display: flex; align-items: center; }
      .topbar { justify-content: space-between; min-height: 48px; }
      .brand { font-family: Georgia, serif; font-size: 26px; letter-spacing: -.05em; }
      .top-actions { display: flex; gap: 4px; align-items: center; }
      .icon-button {
        width: 48px; height: 48px; border: 0; border-radius: 999px;
        display: grid; place-items: center; color: var(--foreground); background: transparent;
        text-decoration: none;
        transition: background .2s ease, color .2s ease;
      }
      .icon-button:hover { background: var(--surface-hover); color: var(--foreground); }
      .mode-switch {
        justify-self: center; gap: 4px; padding: 4px; margin-top: 16px;
        border: 1px solid var(--border); border-radius: 999px; background: var(--surface);
      }
      .mode-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
      .mode-switch label {
        display: grid; place-items: center; min-height: 44px; padding: 0 18px; border-radius: 999px; min-width: 124px;
        text-align: center; color: var(--muted); font-size: 13px; font-weight: 650;
        cursor: pointer; transition: background .2s ease, color .2s ease;
      }
      .mode-switch label:hover { background: var(--surface-hover); color: var(--foreground); }
      #mode-strings:checked ~ .mode-switch label[for="mode-strings"],
      #mode-chromatic:checked ~ .mode-switch label[for="mode-chromatic"] {
        color: var(--primary-foreground); background: var(--primary);
      }
      .stage { min-height: 0; display: grid; place-items: center; width: 100%; }
      .view { min-height: 0; width: min(100%, 1140px); height: 100%; }
      .strings-view { display: flex; flex-direction: column; padding-top: clamp(16px, 3vh, 34px); }
      .intro { text-align: center; flex: none; }
      .target-note { margin-top: 5px; font: 76px/.95 Georgia, serif; letter-spacing: -.065em; }
      .target-note sub, .note sub { font-size: .42em; line-height: 0; vertical-align: baseline; position: relative; bottom: -.1em; }
      .instruction { margin: 11px 0 0; font-size: 15px; color: var(--muted); }
      .string-board {
        display: flex; flex-direction: row; flex: 1; min-height: 0; width: 100%;
        align-items: stretch; justify-content: space-around; padding: 25px 44px 5px 0; position: relative;
      }
      .string-cell { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; }
      svg.wire { flex: 1; min-height: 0; width: 100%; height: 100%; overflow: visible; }
      .wire path { fill: none; stroke: var(--string); stroke-width: var(--string-stroke, 2); vector-effect: non-scaling-stroke; stroke-linecap: round; }
      .string-cell.is-active .wire path { stroke: var(--primary); filter: drop-shadow(0 0 5px var(--primary)); }
      .string-note {
        flex: none; display: flex; align-items: center; justify-content: center;
        min-width: 48px; min-height: 48px; padding: 0 5px; color: var(--muted); border-radius: 999px;
        background: transparent; border: 0; cursor: pointer;
        transition: background .2s ease, color .2s ease, transform .2s ease;
      }
      .string-note:hover { color: var(--foreground); background: var(--surface-hover); }
      .is-active .string-note { color: var(--primary-foreground); background: var(--primary); }
      .is-active .string-note:hover { filter: brightness(1.13); }
      .note { font-size: 18px; white-space: nowrap; line-height: 1; }
      .preset-picker { position: absolute; right: 0; bottom: 6px; z-index: 3; }
      .preset-picker summary {
        list-style: none; cursor: pointer; display: grid; place-items: center;
        width: 48px; height: 48px; color: var(--muted); border-radius: 999px;
        transition: background .2s ease, color .2s ease;
      }
      .preset-picker summary::-webkit-details-marker { display: none; }
      .preset-picker summary:hover { color: var(--foreground); background: var(--surface-hover); }
      .preset-picker svg { width: 19px; height: 19px; transition: transform .2s ease; }
      .preset-picker[open] svg { transform: rotate(180deg); }
      .preset-menu {
        position: absolute; bottom: calc(100% + 9px); right: 0;
        z-index: 3; width: min(250px, calc(100vw - 40px)); max-height: min(330px, 48dvh); overflow: auto;
        padding: 7px; border: 1px solid var(--border);
        background: var(--surface); border-radius: 16px; box-shadow: 0 12px 30px #0005;
      }
      .preset-menu button {
        display: block; width: 100%; min-height: 44px; border: 0; border-radius: 10px; padding: 10px 12px;
        text-align: left; color: var(--foreground); background: transparent; font-size: 14px;
      }
      .preset-menu button:hover { background: var(--surface-hover); }
      .preset-menu button[aria-current="true"] { background: var(--surface-hover); color: var(--primary); }
      .chromatic-view { display: flex; flex-direction: column; align-items: center; padding-top: clamp(22px, 5vh, 60px); }
      #mode-strings:checked ~ .stage .chromatic-view,
      #mode-chromatic:checked ~ .stage .strings-view { display: none; }
      .chromatic-heading { text-align: center; flex: none; }
      .chromatic-heading .target-note { margin-top: 10px; }
      .chromatic-heading .instruction { margin-top: 12px; }
      .chromatic-meter {
        position: relative; width: min(100%, 500px); flex: 1; min-height: 0;
        display: grid; place-items: center; margin-top: 25px;
      }
      .gauge-art { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .gauge-art:not(.is-ready) { visibility: hidden; }
      .gauge-tick { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; opacity: .64; }
      .gauge-symbol { fill: var(--muted); font-size: 18px; font-family: Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .gauge-needle { stroke: var(--primary); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 7px var(--primary)); }
      .gauge-pivot { fill: var(--background); stroke: var(--border); stroke-width: 2; }
      .gauge-pivot-center { fill: var(--primary); }
      .cents-live { margin-top: 12px; color: var(--primary); font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .note-rail { position: absolute; bottom: 0; left: 0; right: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: end; text-align: center; color: var(--muted); font-size: clamp(11px, 2.5vw, 15px); }
      .note-rail span { position: relative; padding-bottom: 12px; }
      .note-rail .is-current { color: var(--foreground); }
      .note-rail .is-current::after { content: ""; position: absolute; bottom: 0; left: 42%; right: 42%; height: 4px; border-radius: 3px 3px 0 0; background: var(--primary); }
      .toolbar {
        min-height: 76px; justify-content: center; gap: 14px; padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      .mic-button {
        width: 56px; height: 56px; border: 0; border-radius: 50%; background: var(--primary);
        color: var(--primary-foreground); display: grid; place-items: center;
        transition: background .2s ease, transform .2s ease;
      }
      .mic-button:hover { filter: brightness(1.12); transform: scale(1.04); }
      .mic-button[aria-pressed="true"] { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
      .status { gap: 7px; font-size: 13px; color: var(--muted); }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 5px #b4dba018; animation: breathe 2s ease-in-out infinite; }
      @keyframes breathe { 50% { box-shadow: 0 0 0 9px #b4dba006; opacity: .6; } }
      @media (min-width: 700px) {
        .app { padding: 28px 44px; }
        .strings-view { align-items: center; gap: clamp(16px, 2vh, 28px); padding: 0 max(12px, 3vw); }
        .intro { width: 100%; text-align: center; }
        .target-note { font-size: clamp(76px, 10vw, 140px); }
        .string-board { flex-direction: column; justify-content: center; gap: clamp(5px, 1vh, 14px); padding: 0; }
        .string-cell { flex: 0 0 auto; width: 100%; min-height: 52px; flex-direction: row; gap: 16px; }
        svg.wire { flex: 1 1 auto; width: 100%; min-width: 0; height: 52px; }
        .string-note { order: -1; width: 52px; min-width: 52px; min-height: 52px; padding: 0; justify-content: center; }
        .preset-picker { position: relative; left: 2px; right: auto; bottom: auto; align-self: flex-start; margin-top: -4px; }
        .preset-picker summary { width: 52px; height: 52px; }
        .preset-menu { bottom: calc(100% + 7px); left: 0; right: auto; }
        .chromatic-view { width: min(100%, 980px); flex-direction: row; gap: 60px; padding: 0; }
        .chromatic-heading { text-align: left; width: 30%; }
        .chromatic-meter { height: 100%; flex: 1; margin: 0; }
        .note-rail { bottom: 3%; }
      }
      @media (min-width: 1000px) {
        .strings-view { flex-direction: row; gap: clamp(35px, 6vw, 100px); }
        .intro { width: clamp(230px, 25%, 360px); text-align: left; }
        .string-board { gap: clamp(10px, 2vh, 20px); }
      }
      @media (max-height: 680px) and (max-width: 699px) {
        .target-note { font-size: 58px; }
        .strings-view { padding-top: 9px; }
        .string-board { padding-top: 12px; }
        .chromatic-view { padding-top: 10px; }
        .chromatic-meter { margin-top: 9px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .status-dot { animation: none; }
        .icon-button, .mode-switch label, .mic-button, .preset-picker summary, .preset-picker svg, .string-note { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">cadence</div>
        <div class="top-actions">
          <button type="button" class="icon-button" id="theme-toggle" aria-label="Switch to light theme"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
          <a class="icon-button" href="./prototype.html"><span class="sr-only">Close tuner</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
        </div>
      </header>
      <input id="mode-strings" type="radio" name="mode" checked hidden />
      <input id="mode-chromatic" type="radio" name="mode" hidden />
      <nav class="mode-switch" aria-label="Tuner mode">
        <label for="mode-strings">String by string</label>
        <label for="mode-chromatic">Chromatic</label>
      </nav>
      <main class="stage">
        <section class="view strings-view" aria-label="String by string tuner">
          <div class="intro">
            <div class="target-note" id="string-target">D<sub>3</sub></div>
            <p class="instruction">Play the selected string</p>
          </div>
          <div class="string-board">
            <div class="string-cell"><svg class="wire" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0 C50 25 50 75 50 100"/></svg><button type="button" class="string-note" aria-label="Select low E string"><span class="note">E<sub>2</sub></span></button></div>
            <div class="string-cell"><svg class="wire" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0 C50 25 50 75 50 100"/></svg><button type="button" class="string-note" aria-label="Select A string"><span class="note">A<sub>2</sub></span></button></div>
            <div class="string-cell is-active"><svg class="wire" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0 C50 25 50 75 50 100"/></svg><button type="button" class="string-note" aria-label="Select D string" aria-pressed="true"><span class="note">D<sub>3</sub></span></button></div>
            <div class="string-cell"><svg class="wire" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0 C50 25 50 75 50 100"/></svg><button type="button" class="string-note" aria-label="Select G string"><span class="note">G<sub>3</sub></span></button></div>
            <div class="string-cell"><svg class="wire" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0 C50 25 50 75 50 100"/></svg><button type="button" class="string-note" aria-label="Select B string"><span class="note">B<sub>3</sub></span></button></div>
            <div class="string-cell"><svg class="wire" aria-hidden="true" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0 C50 25 50 75 50 100"/></svg><button type="button" class="string-note" aria-label="Select high E string"><span class="note">E<sub>4</sub></span></button></div>
            <details class="preset-picker">
              <summary aria-label="Tuning presets"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary>
              <div class="preset-menu">
                <button type="button" data-preset="standard" aria-current="true">Standard</button>
                <button type="button" data-preset="drop-d">Drop D</button>
                <button type="button" data-preset="half-step">Half Step Down (E♭)</button>
                <button type="button" data-preset="full-step">Full Step Down (D Standard)</button>
                <button type="button" data-preset="drop-c">Drop C</button>
                <button type="button" data-preset="dadgad">DADGAD</button>
                <button type="button" data-preset="open-d">Open D</button>
                <button type="button" data-preset="open-g">Open G</button>
                <button type="button" data-preset="open-e">Open E</button>
              </div>
            </details>
          </div>
        </section>
        <section class="view chromatic-view" aria-label="Chromatic tuner">
          <div class="chromatic-heading">
            <div class="target-note" id="chromatic-target">A<sub>2</sub></div>
            <p class="instruction">Play any string</p>
            <p class="cents-live" id="cents-live">0¢</p>
          </div>
          <div class="chromatic-meter" aria-hidden="true">
            <svg class="gauge-art" id="gauge-art" aria-hidden="true">
              <g id="gauge-ticks"></g>
              <line class="gauge-needle" id="chromatic-needle"></line>
              <circle class="gauge-pivot" id="gauge-pivot" r="32"></circle>
              <circle class="gauge-pivot-center" id="gauge-pivot-center" r="5"></circle>
            </svg>
            <div class="note-rail"><span class="is-current">A</span><span>A♯</span><span>B</span><span>C</span><span>C♯</span><span>D</span><span>D♯</span><span>E</span><span>F</span><span>F♯</span><span>G</span><span>G♯</span></div>
          </div>
        </section>
      </main>
      <footer class="toolbar">
        <button type="button" class="mic-button" id="mic-toggle" aria-label="Mute microphone" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg></button>
        <div class="status"><span class="status-dot"></span><span id="mic-status">Listening · demo</span></div>
      </footer>
    </div>
    <script>
      const presets = {
        standard: ["E2", "A2", "D3", "G3", "B3", "E4"],
        "drop-d": ["D2", "A2", "D3", "G3", "B3", "E4"],
        "half-step": ["E♭2", "A♭2", "D♭3", "G♭3", "B♭3", "E♭4"],
        "full-step": ["D2", "G2", "C3", "F3", "A3", "D4"],
        "drop-c": ["C2", "G2", "C3", "F3", "A3", "D4"],
        dadgad: ["D2", "A2", "D3", "G3", "A3", "D4"],
        "open-d": ["D2", "A2", "D3", "F♯3", "A3", "D4"],
        "open-g": ["D2", "G2", "D3", "G3", "B3", "D4"],
        "open-e": ["E2", "B2", "E3", "G♯3", "B3", "E4"],
      };
      // Representative electric 10–46 set, ordered low E to high E.
      const stringGauges = [46, 36, 26, 17, 13, 10];
      const cells = [...document.querySelectorAll(".string-cell")];
      const presetPicker = document.querySelector(".preset-picker");
      const target = document.querySelector("#string-target");
      const meter = document.querySelector(".chromatic-meter");
      const gaugeArt = document.querySelector("#gauge-art");
      const gaugeTicks = document.querySelector("#gauge-ticks");
      const needle = document.querySelector("#chromatic-needle");
      const pivot = document.querySelector("#gauge-pivot");
      const pivotCenter = document.querySelector("#gauge-pivot-center");
      const centsLive = document.querySelector("#cents-live");
      const micToggle = document.querySelector("#mic-toggle");
      const micStatus = document.querySelector("#mic-status");
      let selectedIndex = 2;
      let presetId = "standard";
      let listening = true;
      let timers = [];
      let stringFrame = 0;
      let gaugeFrame = 0;
      let gaugeAngle = 0;
      let gaugeGeometry = { x: 0, y: 0, radius: 0 };
      const svgNamespace = "http://www.w3.org/2000/svg";

      function later(callback, delay) {
        timers.push(setTimeout(callback, delay));
      }
      function cancelDemo() {
        for (const timer of timers) clearTimeout(timer);
        timers = [];
        cancelAnimationFrame(stringFrame);
        cancelAnimationFrame(gaugeFrame);
        stringFrame = 0;
        gaugeFrame = 0;
      }
      function noteMarkup(note) {
        const match = /^([A-G](?:♯|♭)?)([2-4])$/u.exec(note);
        return match ? `${match[1]}<sub>${match[2]}</sub>` : note;
      }
      function noteFrequency(note) {
        const match = /^([A-G])([♯♭]?)([2-4])$/u.exec(note);
        const pitchClasses = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
        const midi = (Number(match[3]) + 1) * 12 + pitchClasses[match[1]] + (match[2] === "♯" ? 1 : match[2] === "♭" ? -1 : 0);
        return 440 * 2 ** ((midi - 69) / 12);
      }
      function wirePath(bend = 0) {
        return matchMedia("(min-width: 700px)").matches
          ? `M0 50 Q50 ${50 + bend} 100 50`
          : `M50 0 Q${50 + bend} 50 50 100`;
      }
      function resetWires() {
        for (const cell of cells) cell.querySelector(".wire path").setAttribute("d", wirePath());
      }
      function setSelected(index) {
        selectedIndex = index;
        cells.forEach((cell, cellIndex) => {
          cell.classList.toggle("is-active", cellIndex === index);
          cell.querySelector(".string-note").setAttribute("aria-pressed", String(cellIndex === index));
        });
        target.innerHTML = noteMarkup(presets[presetId][index]);
        restartDemo();
      }
      function setPreset(id) {
        presetId = id;
        cells.forEach((cell, index) => {
          const note = presets[id][index];
          cell.querySelector(".note").innerHTML = noteMarkup(note);
          cell.querySelector(".string-note").setAttribute("aria-label", `Select ${note} string`);
        });
        for (const button of document.querySelectorAll("[data-preset]")) {
          if (button.dataset.preset === id) button.setAttribute("aria-current", "true");
          else button.removeAttribute("aria-current");
        }
        const name = document.querySelector(`[data-preset="${id}"]`).textContent;
        presetPicker.querySelector("summary").setAttribute("aria-label", `Tuning presets, ${name} selected`);
        presetPicker.open = false;
        target.innerHTML = noteMarkup(presets[id][selectedIndex]);
        restartDemo();
      }
      function pluck() {
        const cell = cells[selectedIndex];
        const path = cell.querySelector(".wire path");
        cancelAnimationFrame(stringFrame);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const targetHz = noteFrequency(presets[presetId][selectedIndex]);
        // Physical 65–330 Hz motion cannot be resolved at display refresh rates.
        // A compressed visible rate preserves the bass-to-treble speed relationship.
        const visualHz = Math.min(18, Math.max(6.5, 7.5 * Math.sqrt(targetHz / 82.4069)));
        const started = performance.now();
        const frame = (now) => {
          const elapsed = now - started;
          const displacement = 62 * Math.exp(-elapsed / 320) * Math.cos((2 * Math.PI * visualHz * elapsed) / 1000);
          path.setAttribute("d", wirePath(displacement));
          if (elapsed < 850) stringFrame = requestAnimationFrame(frame);
          else {
            path.setAttribute("d", wirePath());
            stringFrame = 0;
          }
        };
        path.setAttribute("d", wirePath(62));
        stringFrame = requestAnimationFrame(frame);
      }
      function pointOnGauge(angle, radius) {
        const radians = (angle * Math.PI) / 180;
        return {
          x: gaugeGeometry.x + Math.sin(radians) * radius,
          y: gaugeGeometry.y - Math.cos(radians) * radius,
        };
      }
      function setLine(line, from, to) {
        line.setAttribute("x1", from.x);
        line.setAttribute("y1", from.y);
        line.setAttribute("x2", to.x);
        line.setAttribute("y2", to.y);
      }
      function drawNeedle(angle) {
        gaugeAngle = angle;
        setLine(needle, { x: gaugeGeometry.x, y: gaugeGeometry.y }, pointOnGauge(angle, gaugeGeometry.radius - 27));
      }
      function drawGauge() {
        const width = meter.clientWidth;
        const height = meter.clientHeight;
        if (!width || !height) return;
        gaugeArt.setAttribute("viewBox", `0 0 ${width} ${height}`);
        const x = width / 2;
        const y = height - 88;
        const radius = Math.min(y - 54, (width / 2 - 27) / Math.sin((32 * Math.PI) / 180));
        gaugeGeometry = { x, y, radius };
        gaugeTicks.replaceChildren();
        for (const angle of [-30, -20, -10, -3, 3, 10, 20, 30]) {
          const line = document.createElementNS(svgNamespace, "line");
          line.setAttribute("class", "gauge-tick");
          setLine(line, pointOnGauge(angle, radius - 7), pointOnGauge(angle, radius + (Math.abs(angle) === 30 ? 17 : 12)));
          gaugeTicks.append(line);
        }
        for (const [angle, symbol] of [[-34, "♭"], [34, "♯"]]) {
          const label = document.createElementNS(svgNamespace, "text");
          const position = pointOnGauge(angle, radius - 1);
          label.setAttribute("class", "gauge-symbol");
          label.setAttribute("x", position.x);
          label.setAttribute("y", position.y);
          label.textContent = symbol;
          gaugeTicks.append(label);
        }
        for (const circle of [pivot, pivotCenter]) {
          circle.setAttribute("cx", x);
          circle.setAttribute("cy", y);
        }
        drawNeedle(gaugeAngle);
        gaugeArt.classList.add("is-ready");
      }
      function animateGaugeTo(angle) {
        cancelAnimationFrame(gaugeFrame);
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
          drawNeedle(angle);
          return;
        }
        const from = gaugeAngle;
        const started = performance.now();
        const frame = (now) => {
          const progress = Math.min((now - started) / 650, 1);
          const eased = 1 - (1 - progress) ** 3;
          drawNeedle(from + (angle - from) * eased);
          if (progress < 1) gaugeFrame = requestAnimationFrame(frame);
          else gaugeFrame = 0;
        };
        gaugeFrame = requestAnimationFrame(frame);
      }
      function moveGauge(cents, angle) {
        animateGaugeTo(angle);
        centsLive.textContent = `${cents > 0 ? "+" : ""}${cents}¢`;
      }
      function demoCycle() {
        if (!listening) return;
        pluck();
        moveGauge(-28, -15);
        later(() => moveGauge(-13, -7), 600);
        later(() => moveGauge(6, 3), 1250);
        later(() => moveGauge(0, 0), 1900);
        later(demoCycle, 3600);
      }
      function restartDemo() {
        cancelDemo();
        resetWires();
        drawNeedle(0);
        if (listening) later(demoCycle, 500);
      }
      cells.forEach((cell, index) => {
        cell.querySelector(".string-note").addEventListener("click", () => setSelected(index));
      });
      for (const button of document.querySelectorAll("[data-preset]")) {
        button.addEventListener("click", () => setPreset(button.dataset.preset));
      }
      for (const mode of document.querySelectorAll('input[name="mode"]')) {
        mode.addEventListener("change", () => {
          restartDemo();
          requestAnimationFrame(drawGauge);
        });
      }
      micToggle.addEventListener("click", () => {
        listening = !listening;
        micToggle.setAttribute("aria-pressed", String(!listening));
        micToggle.setAttribute("aria-label", listening ? "Mute microphone" : "Unmute microphone");
        micStatus.textContent = listening ? "Listening · demo" : "Microphone off";
        document.querySelector(".status-dot").style.visibility = listening ? "visible" : "hidden";
        if (!listening) {
          cancelDemo();
          resetWires();
          moveGauge(0, 0);
        } else restartDemo();
      });
      document.querySelector("#theme-toggle").addEventListener("click", (event) => {
        const light = document.documentElement.dataset.theme !== "light";
        document.documentElement.dataset.theme = light ? "light" : "dark";
        event.currentTarget.setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
      });
      addEventListener("resize", () => {
        resetWires();
        drawGauge();
      });
      new ResizeObserver(drawGauge).observe(meter);
      cells.forEach((cell, index) => {
        cell.style.setProperty("--string-stroke", `${0.5 + 0.085 * stringGauges[index]}px`);
      });
      resetWires();
      drawGauge();
      later(demoCycle, 1000);
    </script>
  </body>
</html>
