[workspace]
members = ["crates/cadence-dsp", "crates/cadence-recognition", "crates/cadence-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rustfft = "=6.4.1"
wasm-bindgen = "=0.2.128"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
